# nginx/nginx.conf

# Backend 1: Monolito Django + Gunicorn
upstream django_v1 {
    server web:8000;
}

# Backend 2: Microservicio Flask
upstream flask_v2 {
    server pagos_flask:5000;
}

# Log que muestra a qué backend se redirigió cada petición
log_format strangler '$remote_addr "$request" status=$status -> backend=$upstream_addr';

server {
    listen 80;
    access_log /dev/stdout strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA: estrangulamos la función de compra y la mandamos a Flask
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # RUTA VIEJA: la API v1 sigue yendo a Django
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
    }

    # Todo lo demás (admin, compra/<id>/, etc.) sigue en Django
    location / {
        proxy_pass http://django_v1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}